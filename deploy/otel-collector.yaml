receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Трейсы — в Tempo по OTLP/gRPC.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Метрики — отдаём Prometheus'у, он их скрейпит с 0.0.0.0:8889.
  prometheus:
    endpoint: 0.0.0.0:8889

  # Логи — в Loki по OTLP/HTTP (нативный OTLP-эндпоинт Loki).
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]

  telemetry:
    logs:
      level: info
