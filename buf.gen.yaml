version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/ryoeuyo/sso-microservice/gen
inputs:
  - directory: api/proto
  - directory: third_party
plugins:
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true
